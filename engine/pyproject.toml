[project]
name = "kronos-engine"
version = "0.0.0"
description = "Kronos engine placeholder. HTTP API and health checks belong to a later milestone."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kronos_engine"]
