[project]
name = "kronos-engine"
version = "0.2.0"
description = "Kronos local control-plane engine: loopback API, SQLite state, and sidecar lifecycle."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "uvicorn>=0.32",
    "keyring>=25",
    "watchfiles>=1.0",
]

[project.optional-dependencies]
embeddings = [
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
]
languages = [
    "tree-sitter>=0.24",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]
dev = [
    "hypothesis>=6.100",
    "httpx>=0.27",
    "mypy>=1.13",
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
kronos-engine = "kronos_engine.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kronos_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: process-level engine tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["kronos_engine"]

[[tool.mypy.overrides]]
module = [
    "tree_sitter",
    "tree_sitter.*",
    "tree_sitter_python",
    "tree_sitter_javascript",
    "tree_sitter_typescript",
    "tokenizers",
    "onnxruntime",
    "numpy",
    "watchfiles",
]
ignore_missing_imports = true
