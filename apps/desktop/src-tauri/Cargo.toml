[package]
name = "kronos"
version = "0.1.0"
description = "Kronos desktop shell"
authors = ["Kronos contributors"]
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "kronos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
