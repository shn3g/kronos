name: kronos-pr
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  kronos-policy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Point at committed Kronos policy
        run: echo "Independent review is installed with the GitHub Apps sub-plan."
