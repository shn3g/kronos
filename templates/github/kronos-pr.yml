# SPDX-License-Identifier: AGPL-3.0-or-later
name: kronos-pr
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  checks: read
jobs:
  kronos-policy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Require Kronos reviewer check
        env:
          KRONOS_REVIEW_CHECK_NAME: kronos-review (kronos-reviewer)
        run: echo "Independent review publishes kronos-review (kronos-reviewer) on the exact head SHA. Comments and labels are not identity."
