name: CI

# Jobs run only when a pull request is marked ready for review.
# Draft opened/synchronize events are not in `on`, so they never start a run.
# converted_to_draft starts a skipped run so concurrency can cancel an in-flight matrix.
# There is no `on.push`: merging to main does not re-run tests. Tags use release.yml.
on:
  pull_request:
    types: [ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Version lockstep
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check version lockstep
        run: python3 scripts/check-version-sync.py

  frontend:
    name: Frontend (${{ matrix.os }})
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Playwright smoke (Vite web build)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Install Python engine for with-engine e2e
        if: runner.os == 'Linux'
        run: /usr/bin/python3 -m pip install -e "./engine" --break-system-packages

      - name: Playwright with-engine (full stack)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: pnpm test:e2e:engine

  desktop:
    name: Desktop build (${{ matrix.os }})
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb
          - os: windows-latest
            bundle: nsis
          - os: macos-latest
            bundle: app
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Cargo test
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Clippy
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings

      - name: Build desktop artifact
        working-directory: apps/desktop
        run: pnpm tauri build --bundles ${{ matrix.bundle }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kronos-desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 14

  engine:
    name: Engine (${{ matrix.os }})
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install engine
        working-directory: engine
        run: python -m pip install -e ".[dev]"

      - name: Pytest
        working-directory: engine
        run: python -m pytest

      - name: Ruff
        working-directory: engine
        run: python -m ruff check src tests

      - name: Mypy
        working-directory: engine
        run: python -m mypy
