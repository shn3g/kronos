name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb,appimage
          - os: windows-latest
            bundle: nsis
          - os: macos-latest
            bundle: app
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check version lockstep against tag
        run: python3 scripts/check-version-sync.py

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64 libfuse2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install engine
        working-directory: engine
        run: python -m pip install -e ".[dev]" pyinstaller

      - name: Build bundled engine
        run: python3 scripts/build-engine.py --clean

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail closed if a signed claim is made without TAURI_SIGNING_PRIVATE_KEY
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CLAIM_SIGNED: ${{ vars.CLAIM_SIGNED }}
        shell: bash
        run: |
          if [ "${CLAIM_SIGNED}" = "true" ] && [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "signed assertion failed: no signing key"
            exit 1
          fi

      - name: Build desktop artifact
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles ${{ matrix.bundle }}

      - name: Record Darwin updater architecture
        if: runner.os == 'macOS'
        run: |
          bundle="apps/desktop/src-tauri/target/release/bundle"
          mkdir -p "$bundle"
          case "$(uname -m)" in
            arm64|aarch64) echo aarch64 ;;
            x86_64|amd64) echo x86_64 ;;
            *) echo "unsupported Darwin arch: $(uname -m)" >&2; exit 1 ;;
          esac > "$bundle/darwin-arch.txt"

      - name: Checksums SBOM and provenance
        working-directory: engine
        shell: bash
        env:
          CLAIM_SIGNED: ${{ vars.CLAIM_SIGNED }}
        run: |
          extra=()
          if [ "${CLAIM_SIGNED}" = "true" ]; then
            extra+=(--claim-signed)
          fi
          python -m kronos_engine.ops.release_cli --artifacts ../apps/desktop/src-tauri/target/release/bundle --git-sha ${{ github.sha }} --builder github-actions "${extra[@]}"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kronos-desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: GitHub Release
    needs: desktop
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check version lockstep against tag
        run: python3 scripts/check-version-sync.py

      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: kronos-desktop-*
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p upload
          while IFS= read -r -d '' app; do
            zip -r "upload/Kronos_${TAG#v}_macos.app.zip" "$app"
          done < <(find dist -name '*.app' -type d -print0)
          while IFS= read -r -d '' file; do
            case "$file" in
              *.exe) cp "$file" "upload/Kronos_${TAG#v}_x64-setup.exe" ;;
              *.deb) cp "$file" "upload/Kronos_${TAG#v}_amd64.deb" ;;
              *.AppImage) cp "$file" "upload/$(basename "$file")" ;;
              *.app.tar.gz) cp "$file" "upload/$(basename "$file")" ;;
            esac
          done < <(find dist -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.app.tar.gz' \) -print0)
          if [ -d upload ]; then
            (cd upload && sha256sum -- * > SHA256SUMS)
          fi
          python3 scripts/release-latest-json.py \
            --artifacts dist \
            --version "${TAG#v}" \
            --changelog CHANGELOG.md \
            --release-base-url "https://github.com/${{ github.repository }}/releases/download/${TAG}" \
            --output upload/latest.json
          mapfile -t assets < <(find upload -type f)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no installer assets to publish"
            exit 1
          fi
          python3 scripts/check-version-sync.py --write-release-notes "$RUNNER_TEMP/notes.md" --tag "$TAG"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --repo "${{ github.repository }}"
          fi
          extra=(--verify-tag)
          gh release create "$TAG" "${assets[@]}" "${extra[@]}" \
            --repo "${{ github.repository }}" \
            --title "Kronos ${TAG}" \
            --notes-file "$RUNNER_TEMP/notes.md"
