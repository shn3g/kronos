[project]
name = "kronos-reviewer"
version = "0.0.0"
description = "Isolated Kronos reviewer placeholder. Independent GitHub checks belong to a later milestone."
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kronos_reviewer"]
