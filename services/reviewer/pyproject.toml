[project]
name = "kronos-reviewer"
version = "0.1.0"
description = "Isolated Kronos reviewer: independent checkout, base policy, and App-bound checks."
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "cryptography>=43",
    "httpx>=0.27",
    "kronos-engine @ file:../../engine",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
kronos-reviewer = "kronos_reviewer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kronos_reviewer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
