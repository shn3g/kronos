[project]
name = "kronos-workspace"
version = "0.5.0"
description = "Root tooling pointers for Kronos. Runtime packages live under engine/ and services/."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["engine/src", "services/reviewer/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
